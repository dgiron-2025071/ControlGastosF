<div class="shell">
  <div class="shell-grid" aria-hidden="true"></div>
  <div class="shell-blob shell-blob-teal" aria-hidden="true"></div>
  <div class="shell-blob shell-blob-magenta" aria-hidden="true"></div>
  <div class="shell-blob shell-blob-amber" aria-hidden="true"></div>

  <header class="shell-topbar">
    <div class="shell-brand">
      <img src="assets/logo.png" alt="Control-Gastos" />
      <span>Control-Gastos</span>
    </div>
    <button type="button" class="shell-badge shell-badge-btn" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Volver al Inicio
    </button>
  </header>

  <main class="shell-main">
    <div class="proximamente-card glass-card">
      <div class="status-ring-wrap">
        <span class="status-ring"></span>
        <img src="assets/logo.png" alt="Control-Gastos" class="mascot-img" />
      </div>

      @if (user) {
        <p class="greeting">Hola, {{ user.name }}</p>
      }

      <h1 class="prox-title">Proximamente...</h1>
      <p class="prox-text">Esta seccion esta en desarrollo. Vuelve pronto.</p>

      <div class="progress-dots">
        <span class="dot dot-teal"></span>
        <span class="dot dot-magenta"></span>
        <span class="dot dot-green"></span>
        <span class="dot dot-amber"></span>
      </div>

      <button type="button" class="btn-back" (click)="goBack()">
        Volver al Inicio
      </button>
    </div>
  </main>
</div>
